name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from the packageManager field in package.json — don't also
      # pass `version:` here, or action-setup errors on the duplicate.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Builds the Next app AND the Cloudflare worker bundle — guards against a
      # dep bump breaking the OpenNext adapter (Next 16 is bleeding edge).
      - run: pnpm exec opennextjs-cloudflare build

  db:
    name: db (migrations · RLS pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start
      - run: supabase test db
