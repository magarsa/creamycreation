name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from the packageManager field in package.json — don't also
      # pass `version:` here, or action-setup errors on the duplicate.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Builds the Next app AND the Cloudflare worker bundle — guards against a
      # dep bump breaking the OpenNext adapter (Next 16 is bleeding edge).
      # The NEXT_PUBLIC_* vars (repo Variables, not Secrets — they're public) let
      # the gallery prerender real data. Absent, the build still passes with an
      # empty gallery (queries degrade gracefully).
      - run: pnpm exec opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      # The cron worker is bundled separately from the app, so `next build`
      # wouldn't catch a broken import in it. Dry-run needs no Cloudflare creds.
      - run: pnpm exec wrangler deploy --config workers/cron/wrangler.jsonc --dry-run

  db:
    name: db (migrations · RLS pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start
      - run: supabase test db

  e2e:
    name: e2e (playwright funnel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The funnel E2E mocks the submit API, so it needs no Supabase secrets —
      # pages render (empty gallery is fine) and the client flow is what's tested.
      - run: pnpm test:e2e
